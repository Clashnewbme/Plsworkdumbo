<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sovereign</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="Assets/Sovereign.png" />
<link rel="stylesheet" href="src/style.css"></head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <section id="menuCard">
    <p class="eyebrow">Developed by Freeze Software.</p>
    <h1>Sovereign</h1>
    <div class="options">
      <label>Country name <input id="nameInput" maxlength="16" autocomplete="off"></label>
      <label>Map <select id="mapSelect"></select></label>
      <label>Difficulty <select id="diffSelect"></select></label>
      <label>Opponents <input id="botSelect" type="number" min="1" max="40" step="1" value="14"></label>
      <label>Land adjustment (%) <input id="seaSelect" type="number" min="-20" max="20" step="1" value="0"></label>
      <label>Starting size <input id="startSelect" type="number" min="1" max="3" step="1" value="2"></label>
      <label>Starting troops <input id="troopSelect" type="number" min="0" max="1000000" step="1" value="100"></label>
      <label>Starting gold <input id="goldSelect" type="number" min="0" max="1000000000" step="1" value="100"></label>
      <label>Land needed to win (%) <input id="winSelect" type="number" min="1" max="99" step="1" value="60"></label>
      <label>Territory colour <input id="colorInput" type="color" value="#2a8cff"></label>
    </div>
    <div class="menu-actions">
      <button id="menuResume" hidden>Resume game</button>
      <button id="menuNew">New game</button>
      <button id="shopOpen">Shop (<span id="coins">0</span> coins)</button>
    </div>
    <p class="menu-tip">currently being developed.</p>
  </section>
</div>
<div id="shop" hidden>
  <section id="shopCard">
    <div class="hud-top"><h2>Shop</h2><span>Coins: <b id="shopCoins">0</b></span></div>
    <div id="shopTabs"></div>
    <div id="shopGrid"></div>
    <button id="shopClose">Close</button>
  </section>
</div>
<div id="topControls" class="top-controls" aria-label="Game controls">
  <button id="bPause" class="ctrl-btn" title="Pause game"><span class="ctrl-icon"></span>Pause</button>
  <button id="bUnpause" class="ctrl-btn" title="Unpause game"><span class="ctrl-icon"></span>Unpause</button>
  <button id="bLeave" class="ctrl-btn ctrl-leave" title="Leave match to menu"><span class="ctrl-icon"></span>Forfit</button>
</div>
<div id="hud">
  <div class="hud-stats-row">
    <div id="stats"></div>
  </div>
  <div class="hud-action-row">
    <label id="sliderWrap" class="troop-slider-wrap">
      <span class="slider-title">Send troops:</span>
      <input id="pct" type="range" min="5" max="100" value="50">
      <span id="pctv">20%</span>
    </label>
    <div id="btns">
      <button id="bCity" class="btn-build"><span class="btn-icon"></span>City (<span id="cCity"></span>g)</button>
      <button id="bPort" class="btn-build"><span class="btn-icon"></span>Port (<span id="cPort"></span>g)</button>
      <button id="bDef" class="btn-build"><span class="btn-icon"></span>Defense (<span id="cDef"></span>g)</button>
      <button id="bShip" class="btn-build"><span class="btn-icon"></span>Ship (<span id="cShip"></span>g)</button>
      <button id="bCancel" class="btn-cancel"><span class="btn-icon"></span>Cancel attack</button>
    </div>
  </div>
</div>
<div id="board"></div>
<aside id="diploPanel" class="diplo-panel" aria-label="Diplomacy Feed">
  <div class="diplo-header">
    <div class="diplo-title-wrap">
      <span class="diplo-title">Notifications</span>
    </div>
    <span id="diploStatus" class="diplo-status-pill">Active</span>
  </div>
  <div id="offer" hidden class="diplo-offer-box" role="region" aria-labelledby="offerTitle">
    <section id="offerCard">
      <div class="offer-badge">Incoming Request</div>
      <h3 id="offerTitle">Diplomatic offer</h3>
      <p id="offerText"></p>
      <div class="offer-actions">
        <button id="offerAccept" class="btn-accept">Accept</button>
        <button id="offerReject" class="btn-reject">Reject</button>
      </div>
    </section>
  </div>
  <div id="diploFeed" class="diplo-feed">
    <div class="diplo-placeholder" id="diploEmpty">None.</div>
  </div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<div id="msg" hidden></div>
<script src="src/game.js"></script>
</body></html>
